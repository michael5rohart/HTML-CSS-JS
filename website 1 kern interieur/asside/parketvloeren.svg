<svg width="360" height="500" viewBox="0 0 360 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D2410"/>
      <stop offset="100%" style="stop-color:#5A3820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="500" rx="18" fill="url(#bg1)"/>

  <!-- Parquet planks icon: 3 columns x 4 rows of staggered planks -->
  <g transform="translate(90, 130)">
    <!-- Column 1 -->
    <rect x="0"   y="0"   width="50" height="22" rx="3" fill="rgba(176,117,64,0.15)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="0"   y="28"  width="50" height="22" rx="3" fill="rgba(176,117,64,0.15)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="0"   y="56"  width="50" height="22" rx="3" fill="rgba(176,117,64,0.15)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="0"   y="84"  width="50" height="22" rx="3" fill="rgba(176,117,64,0.15)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="0"   y="112" width="50" height="22" rx="3" fill="rgba(176,117,64,0.15)" stroke="#B07540" stroke-width="1.5"/>

    <!-- Column 2 (offset by 14px) -->
    <rect x="56"  y="14"  width="50" height="22" rx="3" fill="rgba(176,117,64,0.1)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="56"  y="42"  width="50" height="22" rx="3" fill="rgba(176,117,64,0.1)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="56"  y="70"  width="50" height="22" rx="3" fill="rgba(176,117,64,0.1)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="56"  y="98"  width="50" height="22" rx="3" fill="rgba(176,117,64,0.1)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="56"  y="126" width="50" height="22" rx="3" fill="rgba(176,117,64,0.1)" stroke="#B07540" stroke-width="1.5"/>

    <!-- Column 3 (offset by 28px) -->
    <rect x="112" y="0"   width="50" height="22" rx="3" fill="rgba(176,117,64,0.15)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="112" y="28"  width="50" height="22" rx="3" fill="rgba(176,117,64,0.15)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="112" y="56"  width="50" height="22" rx="3" fill="rgba(176,117,64,0.15)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="112" y="84"  width="50" height="22" rx="3" fill="rgba(176,117,64,0.15)" stroke="#B07540" stroke-width="1.5"/>
    <rect x="112" y="112" width="50" height="22" rx="3" fill="rgba(176,117,64,0.15)" stroke="#B07540" stroke-width="1.5"/>

    <!-- Wood grain lines on a few planks -->
    <line x1="12" y1="9"  x2="38" y2="9"  stroke="rgba(176,117,64,0.3)" stroke-width="0.8"/>
    <line x1="68" y1="23" x2="94" y2="23" stroke="rgba(176,117,64,0.3)" stroke-width="0.8"/>
    <line x1="124" y1="9"  x2="150" y2="9"  stroke="rgba(176,117,64,0.3)" stroke-width="0.8"/>
    <line x1="12" y1="65" x2="38" y2="65" stroke="rgba(176,117,64,0.3)" stroke-width="0.8"/>
    <line x1="124" y1="65" x2="150" y2="65" stroke="rgba(176,117,64,0.3)" stroke-width="0.8"/>
  </g>

  <!-- Label -->
  <text x="180" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white" letter-spacing="3">PARKETVLOEREN</text>

  <!-- Subtle bottom line accent -->
  <line x1="130" y1="420" x2="230" y2="420" stroke="#B07540" stroke-width="1" opacity="0.5"/>
</svg>
