<svg width="360" height="500" viewBox="0 0 360 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E1A0A"/>
      <stop offset="100%" style="stop-color:#4A2D15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="500" rx="18" fill="url(#bg2)"/>

  <!-- Herringbone / Visgraat pattern icon -->
  <!-- Row 1 -->
  <g transform="translate(90, 150)" stroke="#B07540" stroke-width="1.8" fill="rgba(176,117,64,0.12)">

    <!-- Diagonal planks going right-down -->
    <rect x="0"  y="0"  width="38" height="14" rx="2" transform="rotate(45 19 7)"/>
    <rect x="40" y="0"  width="38" height="14" rx="2" transform="rotate(-45 59 7)"/>
    <rect x="80" y="0"  width="38" height="14" rx="2" transform="rotate(45 99 7)"/>
    <rect x="120" y="0" width="38" height="14" rx="2" transform="rotate(-45 139 7)"/>

    <rect x="0"  y="38" width="38" height="14" rx="2" transform="rotate(45 19 45)"/>
    <rect x="40" y="38" width="38" height="14" rx="2" transform="rotate(-45 59 45)"/>
    <rect x="80" y="38" width="38" height="14" rx="2" transform="rotate(45 99 45)"/>
    <rect x="120" y="38" width="38" height="14" rx="2" transform="rotate(-45 139 45)"/>

    <rect x="0"  y="76" width="38" height="14" rx="2" transform="rotate(45 19 83)"/>
    <rect x="40" y="76" width="38" height="14" rx="2" transform="rotate(-45 59 83)"/>
    <rect x="80" y="76" width="38" height="14" rx="2" transform="rotate(45 99 83)"/>
    <rect x="120" y="76" width="38" height="14" rx="2" transform="rotate(-45 139 83)"/>

    <rect x="0"  y="114" width="38" height="14" rx="2" transform="rotate(45 19 121)"/>
    <rect x="40" y="114" width="38" height="14" rx="2" transform="rotate(-45 59 121)"/>
    <rect x="80" y="114" width="38" height="14" rx="2" transform="rotate(45 99 121)"/>
    <rect x="120" y="114" width="38" height="14" rx="2" transform="rotate(-45 139 121)"/>
  </g>

  <!-- Label -->
  <text x="180" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white" letter-spacing="3">VISGRAAT</text>

  <!-- Subtle bottom line accent -->
  <line x1="130" y1="420" x2="230" y2="420" stroke="#B07540" stroke-width="1" opacity="0.5"/>
</svg>
