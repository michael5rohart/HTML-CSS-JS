<svg width="360" height="500" viewBox="0 0 360 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3A2010"/>
      <stop offset="100%" style="stop-color:#5C3A1E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="500" rx="18" fill="url(#bg3)"/>

  <!-- Solid wood plank icon: large plank with visible grain lines -->
  <g transform="translate(75, 140)">
    <!-- Outer plank frame -->
    <rect x="0" y="0" width="210" height="180" rx="8" fill="rgba(176,117,64,0.1)" stroke="#B07540" stroke-width="2"/>

    <!-- Wood grain lines horizontal -->
    <line x1="12"  y1="28"  x2="198" y2="28"  stroke="rgba(176,117,64,0.35)" stroke-width="1.2"/>
    <line x1="12"  y1="55"  x2="198" y2="55"  stroke="rgba(176,117,64,0.25)" stroke-width="0.9"/>
    <line x1="12"  y1="78"  x2="198" y2="78"  stroke="rgba(176,117,64,0.35)" stroke-width="1.2"/>
    <line x1="12"  y1="102" x2="198" y2="102" stroke="rgba(176,117,64,0.25)" stroke-width="0.9"/>
    <line x1="12"  y1="126" x2="198" y2="126" stroke="rgba(176,117,64,0.35)" stroke-width="1.2"/>
    <line x1="12"  y1="152" x2="198" y2="152" stroke="rgba(176,117,64,0.25)" stroke-width="0.9"/>

    <!-- Knot accent - circle in the wood -->
    <ellipse cx="65" cy="90" rx="18" ry="12" fill="none" stroke="#B07540" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="65" cy="90" rx="9"  ry="6"  fill="none" stroke="#B07540" stroke-width="1"   opacity="0.4"/>

    <!-- End grain notch marks -->
    <line x1="0"   y1="58"  x2="0"   y2="122" stroke="#D4A96A" stroke-width="3" stroke-linecap="round"/>
    <line x1="210" y1="58"  x2="210" y2="122" stroke="#D4A96A" stroke-width="3" stroke-linecap="round"/>

    <!-- Plank side shadow -->
    <rect x="0" y="180" width="210" height="8" rx="0" fill="rgba(0,0,0,0.25)"/>
    <rect x="0" y="180" width="210" height="8" rx="0" ry="4" fill="none" stroke="#B07540" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Label -->
  <text x="180" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white" letter-spacing="3">MASSIEF HOUT</text>

  <!-- Subtle bottom line accent -->
  <line x1="120" y1="420" x2="240" y2="420" stroke="#B07540" stroke-width="1" opacity="0.5"/>
</svg>
